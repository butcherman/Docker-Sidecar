################################################################################
#                                                                              #
#                                                                              #
#                        Application Docker Development                        #
#           NOTE:  Check .env file for necessary fields to modify to           #
#                           secure this installation                           #
#                                                                              #
#                                                                              #
################################################################################
name: application_dev
networks:
    templateNetwork:
        driver: bridge
volumes:
    dbTemplateData:
    redisTemplateData:

services:
    # Application Container
    applicationtemplate:
        container_name: applicationtemmplate
        restart: unless-stopped
        stop_signal: SIGTERM
        build:
            context: ./application
            dockerfile: Dockerfile
        volumes:
            - ../src:/var/www/html
            - ./.env:/var/www/html/.env
        networks:
            - templateNetwork
        # depends_on:
        #     database:
        #         condition: service_healthy

    # NGINX Web Server
    nginxtemplate:
        container_name: nginxtemplate
        restart: unless-stopped
        stop_signal: SIGTERM
        build:
            context: ../docker/nginx
            dockerfile: Dockerfile
        volumes:
            - ../src:/var/www/html
            - ./.env:/var/www/html/.env
            - ./nginx/default_http.conf:/etc/nginx/conf.d/default.conf
        ports:
            - "8080:80"
            - "4443:443"
        networks:
            - templateNetwork
        # depends_on:
        #     database:
        #         condition: service_started
        #     reverb:
        #         condition: service_started

    # Reverb Container for Websockets
    reverbtemplate:
        container_name: reverbtemplate
        restart: unless-stopped
        stop_signal: SIGTERM
        build:
            context: ./application
            dockerfile: Dockerfile
        volumes:
            - ../src:/var/www/html
            - ./.env:/var/www/html/.env
        networks:
            - templateNetwork
        command: ['php', '/var/www/html/artisan', 'reverb:start']
        # depends_on:
        #     tech_bench:
        #         condition: service_healthy

    # Horizon Container to run background jobs
    horizontemplate:
        container_name: horizontemplate
        restart: unless-stopped
        stop_signal: SIGTERM
        build:
            context: ./application
            dockerfile: Dockerfile
        volumes:
            - ../src:/var/www/html
            - ./.env:/var/www/html/.env
        networks:
            - templateNetwork
        command: ["php", "/var/www/html/artisan", "horizon"]
        # depends_on:
        #     tech_bench:
        #         condition: service_healthy
        #     nginx:
        #         condition: service_healthy

    # Scheduler Container
    schedulertemplate:
        container_name: schedulertemplate
        restart: unless-stopped
        stop_signal: SIGTERM
        build:
            context: ./application
            dockerfile: Dockerfile
        volumes:
            - ../src:/var/www/html
            - ./.env:/var/www/html/.env
        networks:
            - templateNetwork
        command: ["php", "/var/www/html/artisan", "schedule:work"]
        # depends_on:
        #     tech_bench:
        #         condition: service_healthy
        #     nginx:
        #         condition: service_healthy

    #  MySQL Database Container
    databasetemplate:
        container_name: databasetemplate
        restart: unless-stopped
        stop_signal: SIGTERM
        build:
            context: ../docker/database
            dockerfile: Dockerfile
        environment:
            - MYSQL_ROOT_PASSWORD=tbRootPasswd
        volumes:
            - dbTemplateData:/var/lib/mysql
            - ./database/testDatabase.sql:/docker-entrypoint-initdb.d/testDatabase.sql
        networks:
            - templateNetwork
        # ports:
        #     - "3306:3306"

    #  Redis Container for Cache, Job and Email Queuing
    redistemplate:
        container_name: redistemplate
        restart: unless-stopped
        stop_signal: SIGTERM
        build:
            context: ../docker/redis
            dockerfile: Dockerfile
        environment:
            - REDIS_PASSWORD=tbRootPassword
        volumes:
            - redisTemplateData:/data
        networks:
            - templateNetwork
        ports:
            - "6379:6379"

    ###########################################################################################
    #                               Dev Specific Containers                                   #
    ###########################################################################################

    #  Mailpit for Email Traps
    # mailpit:
    #     image: axllent/mailpit:latest
    #     container_name: mailpit
    #     restart: unless-stopped
    #     stop_signal: SIGTERM
    #     networks:
    #         - templateNetwork
    #     ports:
    #         - "8025:8025"
    #         - "1025:1025"

    #  NPM Container to run npm run dev
    npmtemplate:
        container_name: npmtemplate
        restart: unless-stopped
        stop_signal: SIGTERM
        build:
            context: ./application
            dockerfile: Dockerfile
        volumes:
            - ../src:/var/www/html
            - ./.env:/var/www/html/.env
        networks:
            - templateNetwork
        ports:
            - "6173:6173"
        command: npm run dev -- --port 6173
        # depends_on:
        #     tech_bench:
        #         condition: service_healthy
        #     nginx:
        #         condition: service_healthy
